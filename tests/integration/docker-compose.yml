---
name: am-integration

x-dashboard-environment: &dashboard-environment
  PYTEST_ADDOPTS: ${PYTEST_ADDOPTS:-}
  RUN_INTEGRATION_TESTS: "true"
  DJANGO_LIVE_TEST_SERVER_ADDRESS: "archivematica-dashboard:8000"
  DJANGO_ALLOW_ASYNC_UNSAFE: true
  FORWARDED_ALLOW_IPS: "*"
  AM_GUNICORN_ACCESSLOG: "/dev/null"
  DJANGO_SETTINGS_MODULE: "archivematica.dashboard.settings.testmysql"
  ARCHIVEMATICA_DASHBOARD_DASHBOARD_GEARMAN_SERVER: "gearmand:4730"
  ARCHIVEMATICA_DASHBOARD_DASHBOARD_ELASTICSEARCH_SERVER: "elasticsearch:9200"
  ARCHIVEMATICA_DASHBOARD_DASHBOARD_PROMETHEUS_ENABLED: "1"
  ARCHIVEMATICA_DASHBOARD_CLIENT_USER: "archivematica"
  ARCHIVEMATICA_DASHBOARD_CLIENT_PASSWORD: "demo"
  ARCHIVEMATICA_DASHBOARD_CLIENT_HOST: "mysql"
  ARCHIVEMATICA_DASHBOARD_CLIENT_DATABASE: "MCP"
  ARCHIVEMATICA_DASHBOARD_SEARCH_ENABLED: "${AM_SEARCH_ENABLED:-true}"
  ARCHIVEMATICA_DASHBOARD_DASHBOARD_SESSION_COOKIE_SECURE: "false"
  ARCHIVEMATICA_DASHBOARD_DASHBOARD_SESSION_COOKIE_SAMESITE: "Lax"
  ARCHIVEMATICA_DASHBOARD_DASHBOARD_CSRF_COOKIE_SECURE: "false"
  # /src is bind-mounted, so point Django staticfiles to the image-owned dist copy.
  FRONTEND_DIST_DIR: "/opt/am-dashboard-dist"

x-ldap-client-environment: &ldap-client-environment
  AUTH_LDAP_SERVER_URI: "ldap://openldap:389"
  AUTH_LDAP_USERNAME_SUFFIX: "_ldap"
  AUTH_LDAP_BIND_DN: "uid=ldapadmin,dc=archivematica,dc=org"
  AUTH_LDAP_BIND_PASSWORD: "test"
  AUTH_LDAP_USER_SEARCH_BASE_DN: "ou=Users,dc=archivematica,dc=org"
  AUTH_LDAP_USER_SEARCH_BASE_FILTERSTR: "(uid=%(user)s)"
  AUTH_LDAP_GROUP_SEARCH_BASE_DN: "ou=Groups,dc=archivematica,dc=org"
  AUTH_LDAP_GROUP_SEARCH_FILTERSTR: "(objectClass=groupOfNames)"
  AUTH_LDAP_GROUP_IS_ACTIVE: "cn=enabled,ou=Groups,dc=archivematica,dc=org"
  AUTH_LDAP_GROUP_IS_STAFF: "cn=administrators,ou=Groups,dc=archivematica,dc=org"
  AUTH_LDAP_GROUP_IS_SUPERUSER: "cn=administrators,ou=Groups,dc=archivematica,dc=org"
  AUTH_LDAP_REQUIRE_GROUP: "cn=enabled,ou=Groups,dc=archivematica,dc=org"
  AUTH_LDAP_DENY_GROUP: "cn=disabled,ou=Groups,dc=archivematica,dc=org"
  AUTH_LDAP_START_TLS: "false"
  AUTH_LDAP_PROTOCOL_VERSION: "3"

configs:
  keycloak-healthcheck:
    # The Keycloak image ships no curl or wget, so use bash's /dev/tcp. Gate on
    # the OIDC discovery document of every realm the tests log in to, which is
    # only served once `--import-realm` has finished.
    content: |
      for realm in demo secondary shibboleth; do
        exec 3<>/dev/tcp/127.0.0.1/8080 &&
        printf 'GET /realms/%s/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' "$$realm" >&3 &&
        head -n 1 <&3 | grep -q ' 200 ' || exit 1
      done

  openldap-healthcheck:
    # Health check script for the openldap service. Docker runs it with the
    # container environment, so it binds with the LDAP_INIT_* credentials set
    # on the service.
    content: |
      # Fails until slapd accepts connections and the entrypoint has created
      # the organization entry.
      exec ldapsearch -x -H ldap://127.0.0.1:389 \
        -D "$$LDAP_INIT_ROOT_USER_DN" -w "$$LDAP_INIT_ROOT_USER_PW" \
        -b "$$LDAP_INIT_ORG_DN" -s base '(objectClass=*)' dn

  entra-local-healthcheck:
    # The entra-local image ships no curl or wget, so probe the health
    # endpoint with Node.js. The certificate is self-signed, so the probe
    # skips its verification.
    content: |
      const https = require("node:https");
      const request = https.get(
        {
          host: "127.0.0.1",
          port: process.env.PORT,
          path: "/health",
          rejectUnauthorized: false,
          timeout: 4000,
        },
        (response) => process.exit(response.statusCode === 200 ? 0 : 1),
      );
      request.on("error", () => process.exit(1));
      request.on("timeout", () => process.exit(1));

  entra-local-setup:
    # Registers the application and the test user in entra-local through its
    # admin API. The origin, the app registration and the redirect URIs come
    # from the environment of the entra-local-setup service. Existing records
    # answer 409, so the script can run again on a persisted data volume.
    content: |
      const origin = process.env.ENTRA_LOCAL_ORIGIN;
      const appId = process.env.ENTRA_LOCAL_APP_ID;
      const redirectUris = process.env.ENTRA_LOCAL_REDIRECT_URIS.split(",")
        .map((uri) => uri.trim())
        .filter((uri) => uri.length > 0);

      async function call(method, path, body) {
        const response = await fetch(origin + "/admin/api" + path, {
          method,
          headers: { "content-type": "application/json" },
          body: JSON.stringify(body),
        });
        const text = await response.text();
        if (!response.ok && response.status !== 409) {
          throw new Error(method + " " + path + " failed: " + response.status + " " + text);
        }
        console.log(method, path, response.status);
      }

      // The seeded confidential app is the only registration with a known
      // client secret (the admin API generates the secrets it creates), so it
      // becomes the Archivematica registration.
      //
      // Archivematica maps the given_name and family_name claims of the
      // access token to the first and last names of the user. It requests the
      // openid and email scopes only, so Microsoft Entra ID issues the access
      // token for Microsoft Graph: a v1.0 token that carries given_name,
      // family_name and upn as basic claims, when the user has them, without
      // the profile scope (v2.0 tokens need the profile scope and optional
      // claims for them). Microsoft treats the contents of Graph tokens as
      // opaque to clients, so that is an assumption Archivematica makes.
      // entra-local only mints v2.0 tokens: configuring the claims on the
      // registration that GRAPH_RESOURCE_ID names as the Graph resource
      // reproduces the claim set of the v1.0 token.
      await call("PATCH", "/apps/" + appId, {
        displayName: "Archivematica",
        optionalClaims: {
          idToken: [],
          accessToken: [{ name: "given_name" }, { name: "family_name" }, { name: "upn" }],
        },
      });
      for (const uri of redirectUris) {
        await call("POST", "/apps/" + appId + "/redirectUris", { uri, type: "web" });
      }
      await call("POST", "/users", {
        userPrincipalName: "demo@example.com",
        displayName: "Demo User",
        givenName: "Demo",
        surname: "User",
        mail: "demo@example.com",
        password: "demo",
      });

services:

  mysql:
    image: "percona/percona-server:8.4.11-11.1"
    command: "--character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      # These are used in the settings.testmysql modules
      MYSQL_USER: "archivematica"
      MYSQL_PASSWORD: "demo"
      MYSQL_DATABASE: "test_DASHBOARDTEST"
    cap_add:
      - "SYS_NICE"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s

  archivematica-dashboard:
    image: "archivematica-dashboard-integration-tests:latest"
    build:
      context: "../../"
      dockerfile: "hack/Dockerfile"
      args:
        TARGET: "archivematica-dashboard-integration-tests"
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
        UBUNTU_VERSION: ${UBUNTU_VERSION:-26.04}
        PYTHON_VERSION: ${PYTHON_VERSION:-}
    entrypoint: ""
    working_dir: "/src"
    command: ["pytest", "--browser", "firefox", "/src/tests/integration/"]
    hostname: "archivematica-dashboard"
    environment:
      <<: *dashboard-environment
      ARCHIVEMATICA_DASHBOARD_OIDC_AUTHENTICATION: "true"
      OIDC_USE_PKCE: "true"
      OIDC_PKCE_CODE_CHALLENGE_METHOD: "S256"
      OIDC_RP_CLIENT_ID: "am-dashboard"
      OIDC_RP_CLIENT_SECRET: "example-secret"
      OIDC_OP_AUTHORIZATION_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/auth"
      OIDC_OP_TOKEN_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/token"
      OIDC_OP_USER_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/userinfo"
      OIDC_OP_JWKS_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/certs"
      OIDC_OP_LOGOUT_ENDPOINT: "http://keycloak:8080/realms/demo/protocol/openid-connect/logout"
      OIDC_OP_SET_ROLES_FROM_CLAIMS: "true"
      OIDC_OP_ROLE_CLAIM_PATH: "realm_access.roles"
      OIDC_ROLE_CLAIM_ADMIN: "admin"
      OIDC_ROLE_CLAIM_DEFAULT: "default"
      OIDC_ACCESS_ATTRIBUTE_MAP: >
        {"given_name": "first_name", "family_name": "last_name", "realm_access": "realm_access"}
      OIDC_SECONDARY_PROVIDER_NAMES: "secondary"
      OIDC_RP_CLIENT_ID_SECONDARY: "am-dashboard-secondary"
      OIDC_RP_CLIENT_SECRET_SECONDARY: "example-secret-secondary"
      OIDC_OP_AUTHORIZATION_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/auth"
      OIDC_OP_TOKEN_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/token"
      OIDC_OP_USER_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/userinfo"
      OIDC_OP_JWKS_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/certs"
      OIDC_OP_LOGOUT_ENDPOINT_SECONDARY: "http://keycloak:8080/realms/secondary/protocol/openid-connect/logout"
      OIDC_OP_SET_ROLES_FROM_CLAIMS_SECONDARY: "true"
      OIDC_OP_ROLE_CLAIM_PATH_SECONDARY: "realm_access.roles"
      OIDC_ROLE_CLAIM_ADMIN_SECONDARY: "admin-secondary"
      OIDC_ROLE_CLAIM_DEFAULT_SECONDARY: "default-secondary"
      OIDC_ACCESS_ATTRIBUTE_MAP_SECONDARY: >
        {"given_name": "first_name", "family_name": "last_name", "realm_access": "realm_access"}
      OIDC_RP_SIGN_ALGO: "RS256"
    volumes:
      - "../../:/src"
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  archivematica-dashboard-cas:
    image: "archivematica-dashboard-integration-tests:latest"
    entrypoint: ""
    working_dir: "/src"
    command: ["pytest", "--browser", "firefox", "/src/tests/integration/test_cas_auth.py"]
    hostname: "archivematica-dashboard"
    environment:
      <<: *dashboard-environment
      ARCHIVEMATICA_DASHBOARD_DASHBOARD_CAS_AUTHENTICATION: "true"
      AUTH_CAS_SERVER_URL: "http://cas:8080/cas/"
      AUTH_CAS_PROTOCOL_VERSION: "3"
    volumes:
      - "../../:/src"
    depends_on:
      mysql:
        condition: service_healthy
      cas:
        condition: service_healthy

  archivematica-dashboard-ldap:
    image: "archivematica-dashboard-integration-tests:latest"
    entrypoint: ""
    working_dir: "/src"
    command: ["pytest", "--browser", "firefox", "/src/tests/integration/test_ldap_auth.py"]
    hostname: "archivematica-dashboard"
    environment:
      <<: [*dashboard-environment, *ldap-client-environment]
      ARCHIVEMATICA_DASHBOARD_DASHBOARD_LDAP_AUTHENTICATION: "true"
    volumes:
      - "../../:/src"
    depends_on:
      mysql:
        condition: service_healthy
      openldap:
        condition: service_healthy

  archivematica-dashboard-shibboleth:
    image: "archivematica-dashboard-integration-tests:latest"
    entrypoint: ""
    working_dir: "/src"
    command: ["pytest", "--browser", "firefox", "/src/tests/integration/test_shibboleth_auth.py"]
    hostname: "archivematica-dashboard"
    environment:
      <<: *dashboard-environment
      ARCHIVEMATICA_DASHBOARD_DASHBOARD_SHIBBOLETH_AUTHENTICATION: "true"
    volumes:
      - "../../:/src"
    networks:
      default:
        aliases:
          # The service provider proxies to the live test server by this name.
          - archivematica-dashboard
    depends_on:
      mysql:
        condition: service_healthy
      shibboleth-sp:
        condition: service_healthy

  archivematica-dashboard-azure:
    image: "archivematica-dashboard-integration-tests:latest"
    entrypoint: ""
    working_dir: "/src"
    command: ["pytest", "--browser", "firefox", "/src/tests/integration/test_azure_auth.py"]
    hostname: "archivematica-dashboard"
    environment:
      <<: *dashboard-environment
      ARCHIVEMATICA_DASHBOARD_DASHBOARD_OIDC_AUTHENTICATION: "true"
      # The tenant derives the provider endpoints from
      # https://login.microsoftonline.com, an alias of the entra-local service
      # in this network.
      AZURE_TENANT_ID: "11111111-1111-1111-1111-111111111111"
      OIDC_RP_CLIENT_ID: "cccccccc-0000-0000-0000-000000000002"
      OIDC_RP_CLIENT_SECRET: "daemon-app-secret"
      OIDC_RP_SIGN_ALGO: "RS256"
      OIDC_USE_PKCE: "true"
      OIDC_PKCE_CODE_CHALLENGE_METHOD: "S256"
      # entra-local serves a self-signed certificate. The tokens and the
      # signing keys are fetched with requests, which trusts this bundle.
      REQUESTS_CA_BUNDLE: "/etc/entra-local/tls/cert.pem"
    volumes:
      - "../../:/src"
      - "entra_local_data:/etc/entra-local:ro"
    depends_on:
      mysql:
        condition: service_healthy
      entra-local:
        condition: service_healthy
      entra-local-setup:
        condition: service_completed_successfully

  keycloak:
    image: "quay.io/keycloak/keycloak:26.7.4-0"
    command: ["start-dev", "--import-realm"]
    restart: "unless-stopped"
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
      KC_METRICS_ENABLED: true
      KC_LOG_LEVEL: "INFO"
    ports:
      - 8080:8080
    volumes:
      - "./etc/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro"
      - "./etc/keycloak/shibboleth-realm.json:/opt/keycloak/data/import/shibboleth-realm.json:ro"
    configs:
      - source: keycloak-healthcheck
        target: /usr/local/bin/keycloak-healthcheck
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/keycloak-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  shibboleth-sp:
    image: "archivematica-shibboleth-sp"
    build:
      context: "../../hack/etc/shibboleth"
    environment:
      # The browser and the service provider both reach Keycloak by its
      # service name inside the Compose network, so one URL serves as the
      # identity provider entity ID and as the metadata source.
      SHIBBOLETH_IDP_URL: "http://keycloak:8080/realms/shibboleth"
      SHIBBOLETH_IDP_METADATA_URL: "http://keycloak:8080/realms/shibboleth/protocol/saml/descriptor"
    volumes:
      - "../../hack/etc/shibboleth/shibboleth2.xml:/etc/shibboleth-templates/shibboleth2.xml:ro"
      - "../../hack/etc/shibboleth/attribute-map-archivematica.xml:/etc/shibboleth/attribute-map-archivematica.xml:ro"
      - "../../hack/etc/shibboleth/attribute-policy.xml:/etc/shibboleth/attribute-policy.xml:ro"
      - "../../hack/etc/shibboleth/apache/archivematica.conf:/etc/apache2/sites-enabled/archivematica.conf:ro"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "2"
        - http://127.0.0.1/Shibboleth.sso/Status
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  cas:
    image: "archivematica-cas"
    build:
      context: "../../hack/etc/cas"
      args:
        # Head of the cas-overlay-template 7.3 branch (CAS 7.3.8).
        CAS_OVERLAY_COMMIT: "${CAS_OVERLAY_COMMIT:-b244d192d9462068fc24625a75ebe19ed6fc34cd}"
    volumes:
      - "./etc/cas/config:/etc/cas/config:ro"
      - "./etc/cas/services:/etc/cas/services:ro"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "2"
        - http://127.0.0.1:8080/cas/login
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  openldap:
    # Upstream publishes versioned tags, but may rebuild them to pick up
    # base-image security updates. Keep the version tag for readability and
    # pin the exact build by digest; Dependabot keeps both up to date.
    image: "vegardit/openldap:2.6.10@sha256:b81f6c360830b21b9e6d8878563e3e11bd81e243693c83fa371efeee34556ce9"
    environment:
      LDAP_INIT_ORG_DN: "dc=archivematica,dc=org"
      LDAP_INIT_ORG_NAME: "Archivematica integration tests"
      LDAP_INIT_ORG_ATTR_O: "Archivematica"
      LDAP_INIT_ROOT_USER_DN: "uid=ldapadmin,dc=archivematica,dc=org"
      LDAP_INIT_ROOT_USER_PW: "test"
      # The image's default password policy requires eight characters and
      # would reject the shared four-character test password in the LDIF.
      LDAP_INIT_PPOLICY_PW_MIN_LENGTH: "4"
      LDAP_TLS_ENABLED: "false"
      LDAP_LDAPS_ENABLED: "false"
    volumes:
      - "../../hack/etc/ldap/init_org_entries.ldif:/opt/ldifs/init_org_entries.ldif:ro"
    configs:
      - source: openldap-healthcheck
        target: /usr/local/bin/openldap-healthcheck
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/openldap-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  entra-local:
    # Emulator of Microsoft Entra ID (https://github.com/cmaneu/entra-local).
    # The Dashboard derives the Azure endpoints from
    # https://login.microsoftonline.com when AZURE_TENANT_ID is set, so the
    # emulator listens on port 443, gets that hostname as a network alias and
    # advertises it as its public origin: its token issuer becomes
    # https://login.microsoftonline.com/<tenant>/v2.0, like Entra ID.
    image: "ghcr.io/cmaneu/entra-local:0.1.1@sha256:70584ef110914d100409cb3d63a63548ccdde10ca780f9751755f1482dec5d7e"
    environment:
      PORT: "443"
      TENANT_ID: "11111111-1111-1111-1111-111111111111"
      PUBLIC_ORIGIN: "https://login.microsoftonline.com"
      # entra-local adds the access-token claims configured on the app whose
      # id is the audience of the token. An OpenID Connect sign-in requests
      # no API scope, so the audience is the Graph resource: naming the
      # Archivematica registration here makes its access tokens carry the
      # name claims of a Microsoft Graph token (see the entra-local-setup
      # config).
      GRAPH_RESOURCE_ID: "cccccccc-0000-0000-0000-000000000002"
      # Show the username and password form instead of the account picker.
      REQUIRE_PASSWORD: "true"
    networks:
      default:
        aliases:
          - login.microsoftonline.com
    volumes:
      # Holds the SQLite database and the self-signed certificate, which the
      # other services mount to trust it.
      - "entra_local_data:/app/data"
    configs:
      - source: entra-local-healthcheck
        target: /usr/local/bin/entra-local-healthcheck.js
    healthcheck:
      test: ["CMD", "node", "/usr/local/bin/entra-local-healthcheck.js"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  entra-local-setup:
    # One-shot service: registers the Dashboard and the test user through
    # the admin API of entra-local (see the entra-local-setup config).
    image: "ghcr.io/cmaneu/entra-local:0.1.1@sha256:70584ef110914d100409cb3d63a63548ccdde10ca780f9751755f1482dec5d7e"
    command: ["node", "/usr/local/bin/entra-local-setup.mjs"]
    environment:
      ENTRA_LOCAL_ORIGIN: "https://login.microsoftonline.com"
      ENTRA_LOCAL_APP_ID: "cccccccc-0000-0000-0000-000000000002"
      ENTRA_LOCAL_REDIRECT_URIS: "http://archivematica-dashboard:8000/oidc/callback/"
      NODE_EXTRA_CA_CERTS: "/etc/entra-local/tls/cert.pem"
    volumes:
      - "entra_local_data:/etc/entra-local:ro"
    configs:
      - source: entra-local-setup
        target: /usr/local/bin/entra-local-setup.mjs
    depends_on:
      entra-local:
        condition: service_healthy

volumes:
  entra_local_data:
