[build-system]
requires = ["setuptools>=74", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name="archivematica"
description="Web- and standards-based, open-source application which allows your institution to preserve long-term access to trustworthy, authentic and reliable digital content."
requires-python = ">=3.10"
authors = [
  {name = "Artefactual Systems Inc.", email = "info@artefactual.com"},
]
maintainers = [
  {name = "Artefactual Systems Inc.", email = "info@artefactual.com"},
]
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
dynamic = [
  "version",
]
dependencies = [
  "django-shibboleth-remoteuser @ git+https://github.com/artefactual-labs/django-shibboleth-remoteuser.git@f08a7864d6130416c352981ccf318fff0fd5be58",
  "Django>=5.2,<6",
  "agentarchives",
  "amclient",
  "ammcpc",
  "bagit @ git+https://github.com/LibraryOfCongress/bagit-python.git@4bd2713cedbe1f8e634567c20ef0dded9622011d",
  "brotli",
  "clamav-client",
  "django-autoslug",
  "django-csp",
  "django-forms-bootstrap",
  "django-prometheus",
  "django-stubs-ext",
  "django-tastypie",
  "elasticsearch>=8.0.0,<9.0.0",
  "filelock",
  "gearman3 @ git+https://github.com/artefactual-labs/python-gearman.git@b68efc868c7a494dd6a2d2e820fb098a6da9f797",
  "gevent",
  "gunicorn",
  "inotify-simple",
  "jsonschema",
  "lazy-paged-sequence",
  "lxml",
  "metsrw",
  "orjson",
  "opf-fido @ git+https://github.com/artefactual-labs/fido.git@3e16f31492d72ae650b25fabc9b9f55a7c4259f2",
  "prometheus_client",
  "python-dateutil",
  "requests",
  "unidecode",
  "whitenoise",
  # Required by LDAP authentication
  "django-auth-ldap",
  "python-ldap",
  # Required by CAS authentication
  "django-cas-ng",
  # Required for OpenID Connect authentication
  "mozilla-django-oidc",
  "pyjwt",
]

[dependency-groups]
dev = [
  "coverage[toml]",
  "django-stubs[compatible-mypy]",
  "mockldap @ git+https://github.com/artefactual-labs/mockldap@v0.3.1",
  "playwright",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "pytest-playwright",
  "pytest-randomly",
  "tox",
  "tox-uv-bare>=1.35.2",
]

[tool.uv]
# Keep compatibility with newer global uv installations used by deployments.
# GitHub Actions reads this value automatically via astral-sh/setup-uv.
required-version = ">=0.11.30"

[project.urls]
homepage = "https://www.archivematica.org/"
documentation = "https://www.archivematica.org/en/docs/archivematica-latest/"
repository = "https://github.com/artefacutal/archivematica"
issues = "https://github.com/archivematica/Issues/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["archivematica*"]

[tool.setuptools.dynamic]
version = {attr = "archivematica.archivematicaCommon.version.get_full_version"}

[tool.pytest.ini_options]
addopts = "--reuse-db -p no:cacheprovider"
DJANGO_SETTINGS_MODULE="settings.test"
norecursedirs = ".svn _build tmp* node_modules bower_components share .tox .venv"

[tool.coverage.run]
omit = [
    "**/src/archivematica/archivematicaCommon/externals/*",
    "**/migrations/*",
    "**/settings/*",
    "**/tests/*",
    "**/wsgi.py",
    "**/manage.py",
]
include = [
    "**/src/archivematica/archivematicaCommon/*",
    "**/src/archivematica/dashboard/*",
    "**/src/archivematica/MCPClient/*",
    "**/src/archivematica/MCPClient/clientScripts/*",
    "**/src/archivematica/MCPServer/*",
]
branch = true

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
# Rule reference: https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "UP",
    "W",
]
ignore = [
    "B018",
    "B904",
    "E402",
    "E501",
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"src/archivematica/**/settings/*" = ["F403"]
"src/archivematica/dashboard/settings/*" = ["F405"]
"src/archivematica/settings/testmysql.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.mypy]
strict = true
explicit_package_bases = true
files = ["src", "tests"]
exclude = [
    '^src/archivematica/dashboard/fpr/migrations-data/.*\.py$',
]
mypy_path = [
  "$MYPY_CONFIG_FILE_DIR/src",
  "$MYPY_CONFIG_FILE_DIR/typings",
]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = [
    "archivematica.*",
    "tests.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "archivematica.archivematicaCommon.transfer_source_retrieval",
    "archivematica.archivematicaCommon.executeOrRunSubProcess",
    "archivematica.MCPClient.client.*",
    "archivematica.MCPClient.clientScripts.characterize_file",
    "archivematica.MCPClient.clientScripts.has_packages",
    "archivematica.MCPClient.clientScripts.identify_dspace_files",
    "archivematica.MCPClient.clientScripts.identify_file_format",
    "archivematica.MCPClient.clientScripts.normalize",
    "archivematica.MCPClient.clientScripts.policy_check",
    "archivematica.MCPClient.clientScripts.retrieve_transfer_source",
    "archivematica.MCPClient.clientScripts.transcribe_file",
    "archivematica.MCPClient.clientScripts.validate_file",
    "archivematica.search.service",
    "tests.archivematicaCommon.test_execute_functions",
    "tests.conftest",
    "tests.dashboard.components.accounts.test_views",
    "tests.dashboard.components.administration.test_administration",
    "tests.dashboard.fpr.test_command_get_fpr_changes",
    "tests.dashboard.fpr.test_command_import_pronom_ids",
    "tests.dashboard.fpr.test_views",
    "tests.dashboard.test_oidc",
    "tests.integration.test_oidc_auth",
    "tests.MCPClient.conftest",
    "tests.MCPClient.test_characterize_file",
    "tests.MCPClient.test_create_mets_v2",
    "tests.MCPClient.test_fpr_commands",
    "tests.MCPClient.test_has_packages",
    "tests.MCPClient.test_identify_dspace_files",
    "tests.MCPClient.test_identify_file_format",
    "tests.MCPClient.test_normalize",
    "tests.MCPClient.test_policy_check",
    "tests.MCPClient.test_transcribe_file",
    "tests.MCPClient.test_validate_file",
    "tests.search.test_service",
]
ignore_errors = false

[tool.django-stubs]
django_settings_module = "archivematica.settings.testmysql"

[tool.tox]
legacy_tox_ini = """
    [tox]
    envlist =
        archivematica-common
        dashboard
        mcp-server
        mcp-client
        storage-service
        migrations-dashboard
        migrations-storage-service
        linting
        archivematica

    [testenv]
    runner = uv-venv-lock-runner
    package = editable
    dependency_groups = dev
    commands = py.test {posargs}
    allowlist_externals =
        bash
        env
        find
    setenv =
        # General
        LOGNAME = user
        DJANGO_SETTINGS_MODULE = {env:DJANGO_SETTINGS_MODULE:settings.test}
        PYTEST_ADDOPTS = {env:PYTEST_ADDOPTS:}
        UV_CACHE_DIR = {temp_dir}/uv-cache
        # Storage Service
        STORAGE_SERVICE_ROOT = {toxinidir}/hack/submodules/archivematica-storage-service
        # TOXENV-specific
        # Setting HOME prevents Python's pwd module to ask for a real uid inside
        # the container, and using {temp_dir} allows caching the pre-commit
        # dependencies in the tox host
        linting: HOME = {temp_dir}/user
    changedir =
        archivematica-common: {toxinidir}/tests/archivematicaCommon
        dashboard: {toxinidir}/tests/dashboard
        mcp-server: {toxinidir}/tests/MCPServer
        mcp-client: {toxinidir}/tests/MCPClient
        storage-service: {env:STORAGE_SERVICE_ROOT}

    [testenv:archivematica]
    change_dir = {toxinidir}/tests

    [testenv:storage-service]
    runner = uv-venv-runner
    package = skip
    dependency_groups =
    deps =
        uv>=0.11.30
    setenv =
        {[testenv]setenv}
        UV_CACHE_DIR = {envdir}/uv-cache
        UV_PROJECT_ENVIRONMENT = {envdir}/storage-service
        UV_PYTHON_DOWNLOADS = never
    commands =
        env VIRTUAL_ENV={envdir}/storage-service uv run \
            --project {env:STORAGE_SERVICE_ROOT} \
            --locked \
            --python {envpython} \
            pytest {posargs}

    [testenv:migrations-dashboard]
    commands = django-admin makemigrations --check --dry-run

    [testenv:migrations-storage-service]
    runner = uv-venv-runner
    package = skip
    dependency_groups =
    deps = {[testenv:storage-service]deps}
    setenv = {[testenv:storage-service]setenv}
    commands =
        env VIRTUAL_ENV={envdir}/storage-service uv run \
            --project {env:STORAGE_SERVICE_ROOT} \
            --locked \
            --no-dev \
            --python {envpython} \
            django-admin makemigrations --check --dry-run

    [testenv:linting]
    package = skip
    commands = pre-commit run --all-files --show-diff-on-failure
"""
