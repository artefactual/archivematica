# Used by docker-compose.shibboleth.yml in place of archivematica.conf: both
# applications are reached through the Shibboleth service provider, which
# proxies to them after authenticating the browser.
server {
	listen 80;
	client_max_body_size 256M;
	server_name _;
	location / {
		set $upstream_endpoint http://shibboleth-sp:80;

		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_redirect off;
		proxy_buffering off;
		proxy_read_timeout 172800s;
		proxy_pass $upstream_endpoint;
	}
}

server {
	listen 8000;
	client_max_body_size 256M;
	server_name _;
	location / {
		set $upstream_endpoint http://shibboleth-sp:8000;

		proxy_set_header Host $http_host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_redirect off;
		proxy_buffering off;
		proxy_read_timeout 172800s;
		proxy_pass $upstream_endpoint;
	}
}
