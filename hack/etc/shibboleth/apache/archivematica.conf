# Development-only Apache configuration for the Shibboleth service provider in
# front of Archivematica. The Dashboard is served on port 80 and the Storage
# Service on port 8000, the ports nginx proxies to.
#
# Self-referential URLs, including the assertion consumer service URL sent to
# the identity provider, are built from the Host header that nginx passes
# through (UseCanonicalName Off), so this file carries no host ports.
#
# mod_shib exports the released attributes as request headers and drops any
# the client sent under the same names, so only its own values reach the
# applications. The /Shibboleth.sso handler and the /shibboleth-sp assets are
# configured by the package's conf-enabled/shib.conf.

<VirtualHost *:80>
    ServerName localhost
    UseCanonicalName Off

    ProxyRequests Off
    ProxyPreserveHost On
    # Matches proxy_read_timeout in the nginx configuration.
    ProxyTimeout 172800

    <Location />
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        ShibUseHeaders On
        Require valid-user
    </Location>

    # The API authenticates with its own keys and is called by other services:
    # a Shibboleth session is used when present, but not required.
    <Location /api>
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>

    # Shown after logout, once the Shibboleth session is gone, along with the
    # static files and the JavaScript catalog it loads, which the Dashboard
    # serves to anyone.
    <Location /administration/accounts/logged-out>
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>

    <Location /media>
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>

    <Location /jsi18n>
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>

    ProxyPass /Shibboleth.sso !
    ProxyPass /shibboleth-sp !
    ProxyPass / http://archivematica-dashboard:8000/
    ProxyPassReverse / http://archivematica-dashboard:8000/
</VirtualHost>

<VirtualHost *:8000>
    ServerName localhost
    UseCanonicalName Off

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 172800

    <Location />
        AuthType shibboleth
        ShibRequestSetting requireSession 1
        ShibRequestSetting applicationId storage-service
        ShibUseHeaders On
        Require valid-user
    </Location>

    <Location /api>
        ShibRequestSetting requireSession 0
        Require shibboleth
    </Location>

    ProxyPass /Shibboleth.sso !
    ProxyPass /shibboleth-sp !
    ProxyPass / http://archivematica-storage-service:8000/
    ProxyPassReverse / http://archivematica-storage-service:8000/
</VirtualHost>
