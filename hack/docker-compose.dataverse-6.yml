  # Storage Service script that registers the instance as a transfer source.
  dataverse6-register-transfer-source:
    content: |
      #!/usr/bin/env python
      """Register the development Dataverse 6 as a Storage Service transfer source.

      Run it inside the Storage Service container of the Dataverse overlay:

          docker compose -f docker-compose.yml -f docker-compose.dataverse-6.yml \\
              exec archivematica-storage-service \\
              python /etc/archivematica/dataverse6/register_transfer_source.py

      It creates a Dataverse space for the dataverse6 service, or updates its
      settings, with a transfer source location shared with every pipeline, and
      prints the UUID of the location. Running it again is harmless.
      """

      import os
      import sys

      import django

      django.setup()

      from archivematica.storage_service.locations.models import Dataverse
      from archivematica.storage_service.locations.models import Location
      from archivematica.storage_service.locations.models import Pipeline
      from archivematica.storage_service.locations.models import Space
      from django.db import transaction

      # PREMIS agent recorded for the files downloaded from this Dataverse.
      AGENT_NAME = "Archivematica Dataverse 6"
      AGENT_TYPE = "Dataverse"
      STAGING_PATH = "/var/archivematica/storage_service"
      # Every dataset in the instance. The Storage Service documentation describes
      # the "Query:" and "Subtree:" filters.
      RELATIVE_PATH = "Query: *"
      DESCRIPTION = "Dataverse 6 (development)"


      def main() -> int:
          url = os.environ.get(
              "ARCHIVEMATICA_DATAVERSE6_URL", "http://dataverse6.localhost:62087"
          )
          api_token = os.environ.get("ARCHIVEMATICA_DATAVERSE6_API_TOKEN", "")
          if not api_token:
              print("ARCHIVEMATICA_DATAVERSE6_API_TOKEN is not set.", file=sys.stderr)
              return 1
          pipelines = list(Pipeline.objects.all())
          if not pipelines:
              print(
                  "No pipeline is registered yet. Bootstrap the environment first.",
                  file=sys.stderr,
              )
              return 1

          with transaction.atomic():
              try:
                  dataverse = Dataverse.objects.get(host=url)
              except Dataverse.DoesNotExist:
                  space = Space.objects.create(
                      access_protocol=Space.DATAVERSE, path="", staging_path=STAGING_PATH
                  )
                  dataverse = Dataverse.objects.create(
                      space=space,
                      host=url,
                      api_key=api_token,
                      agent_name=AGENT_NAME,
                      agent_type=AGENT_TYPE,
                      agent_identifier=url,
                  )
                  action = "Created"
              else:
                  dataverse.api_key = api_token
                  dataverse.agent_name = AGENT_NAME
                  dataverse.agent_type = AGENT_TYPE
                  dataverse.agent_identifier = url
                  dataverse.save()
                  action = "Updated"
              location, _ = Location.objects.get_or_create(
                  space=dataverse.space,
                  purpose=Location.TRANSFER_SOURCE,
                  defaults={
                      "relative_path": RELATIVE_PATH,
                      "description": DESCRIPTION,
                      "enabled": True,
                  },
              )
              location.pipeline.set(pipelines)

          print(f"{action} the Dataverse space {dataverse.space.uuid} for {url}.")
          print(f"Transfer source location: {location.uuid}")
          return 0


      if __name__ == "__main__":
          sys.exit(main())

  # Storage Service script that downloads the sample datasets as transfers.
  dataverse6-export-sample-transfers:
    content: |
      #!/usr/bin/env python
      """Export the sample datasets of the development Dataverse 6 as transfers.

      Run it inside the Storage Service container of the Dataverse overlay:

          docker compose -f docker-compose.yml -f docker-compose.dataverse-6.yml \\
              exec archivematica-storage-service \\
              python /etc/archivematica/dataverse6/export_sample_transfers.py

      The dataset named by each manifest in datasets.json is fetched through the
      Dataverse space of the Storage Service, exactly as a transfer receives it,
      into the staging directory below. The script prints the exported directory
      names, one per line, for the commands in docker-compose.dataverse-6.yml that
      copy them into the sampledata checkout.
      """

      import json
      import os
      import pathlib
      import shutil
      import sys

      import django

      django.setup()

      from archivematica.storage_service.locations.models import Dataverse

      DATASETS_FILE = pathlib.Path(__file__).resolve().parent / "datasets.json"
      EXPORT_DIR = pathlib.Path(
          "/var/archivematica/storage_service/dataverse6-sample-transfers"
      )


      def dataset_directories() -> dict[str, str]:
          """Map the title of each dataset of the manifests to its directory."""
          directories: dict[str, str] = {}
          for manifest in json.loads(DATASETS_FILE.read_text()):
              fields = manifest["dataset"]["datasetVersion"]["metadataBlocks"][
                  "citation"
              ]["fields"]
              titles = [field["value"] for field in fields if field["typeName"] == "title"]
              if not titles:
                  raise ValueError(f"{manifest['directory']} has no title field")
              directories[str(titles[0])] = str(manifest["directory"])
          return directories


      def main() -> int:
          url = os.environ.get(
              "ARCHIVEMATICA_DATAVERSE6_URL", "http://dataverse6.localhost:62087"
          )
          try:
              dataverse = Dataverse.objects.get(host=url)
          except Dataverse.DoesNotExist:
              print(
                  f"No Dataverse space uses {url}. Run register_transfer_source.py first.",
                  file=sys.stderr,
              )
              return 1
          directories = dataset_directories()

          listing = dataverse.browse("Query: *")
          exported: set[str] = set()
          for entity_id, properties in listing["properties"].items():
              directory = directories.get(properties["verbose name"])
              if directory is None:
                  continue
              destination = EXPORT_DIR / directory
              shutil.rmtree(destination, ignore_errors=True)
              dataverse.move_to_storage_service(entity_id, str(destination), dataverse.space)
              exported.add(directory)
              print(directory)

          missing = sorted(set(directories.values()) - exported)
          if missing:
              print(f"Datasets not found in Dataverse: {', '.join(missing)}", file=sys.stderr)
              return 1
          return 0


      if __name__ == "__main__":
          sys.exit(main())
