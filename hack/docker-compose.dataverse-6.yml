---
# Dataverse 6 transfer source
# ===========================
#
# Use this overlay to run a local Dataverse 6 (https://dataverse.org/) instance
# with sample datasets and use it as a transfer source, for example to test
# changes to the Dataverse integration against a current release, such as the
# handling of the originalFileName field of tabular files in the "Convert
# Dataverse structure" job. The overlay is independent of
# docker-compose.dataverse-4.yml, which runs Dataverse 4.20 with its own
# services, ports, volumes and Storage Service space, so both can run at the
# same time. The base development environment must be installed and
# bootstrapped first as described in the Installation section of the README:
#
#   docker compose -f docker-compose.yml -f docker-compose.dataverse-6.yml up -d --build
#
# The overlay runs Dataverse 6.11 from the application and config baker images
# published by the Dataverse project (gdcc/dataverse and gdcc/configbaker, on
# Payara 7 and Java 21), with the PostgreSQL 17 and Solr 9.8 versions of its
# own development setup and an Rserve (https://www.rforge.net/Rserve/) server
# built from the rocker/r-ver image. The Solr image is built from the official
# one by copying the Dataverse configset out of the config baker image, which
# the Dataverse compose examples do with a helper container instead. Dataverse
# uses Rserve to ingest R data files and to generate the R data file that is
# part of the bundle of every tabular file, which Archivematica expects to
# find when it parses a Dataverse transfer.
#
# The first start takes a few minutes while Payara deploys the application.
# The dataverse6-bootstrap service then installs Dataverse with the setup
# scripts of the config baker image, creates the sample datasets described
# below and exits. Follow its progress with:
#
#   docker compose -f docker-compose.yml -f docker-compose.dataverse-6.yml logs -f dataverse6-bootstrap
#
# This overlay is intended for local testing and demonstrations only. The
# Dataverse web interface is available at http://dataverse6.localhost:62087
# with the superuser account dataverseAdmin and the password admin1. Its API
# token is fixed to 7c0b8e2d-3f4a-4b5c-9d6e-1f2a3b4c5d6e so that the scripts
# below can use it. The /api/admin endpoints require the unblock-key=unblock
# query parameter, and the built-in users key is burrito, so more accounts can
# be created through the API.
#
# The dataverse6.localhost hostname must resolve to the local host in the
# browser, which is the standard behaviour for *.localhost names in modern
# browsers and Linux distributions. The overlay also sets it as a Docker
# network alias so the Storage Service and the bootstrap service can use the
# same URL, and a script sourced by the entrypoint of the Dataverse image
# makes Payara listen on the published port instead of 8080. If
# dataverse6.localhost does not resolve on your host, add the following entry
# to /etc/hosts:
#
#   127.0.0.1 dataverse6.localhost
#
# Layout of this file
# -------------------
#
# Everything the overlay needs is in this file. The scripts and the dataset
# manifests are Compose configs with inline content, listed in the configs
# section at the end, that Compose copies into the containers; the Solr and
# Rserve images are built from the inline Dockerfiles of their services. Two
# consequences of that:
#
# - Compose interpolates ${VARIABLE} references in every value of the file,
#   inline content included, so each $ of the embedded shell scripts is
#   written as $$ (Compose turns $$ into a single $).
# - Compose copies the inline content into a container each time `up` or
#   `run` starts it, but a container that keeps running, or is merely
#   restarted, keeps the copy it started with. After editing an embedded
#   script or manifest, start the one-shot bootstrap service again with `up`
#   and recreate the Storage Service container with `up --force-recreate`, as
#   the commands below do.
#
# Sample datasets
# ---------------
#
# The bootstrap service publishes one dataset per manifest of the
# dataverse6-datasets config: the same datasets as docker-compose.dataverse-4.yml,
# with the license given as the object Dataverse 6 expects and productionPlace
# as the multiple field it has become. Each manifest
# holds the name of the sample transfer directory, the dataset metadata in the
# format of the Dataverse native API and the list of files to upload from the
# Dataverse sample transfers of the sampledata submodule
# (SampleTransfers/Dataverse/): the original files of the four transfers that
# have been there since Archivematica 1.8, and the SPSS, Stata 14, Excel and R
# files of "A study of my afternoon drinks in tabular data formats", which
# exercise the tabular ingest. The sampledata checkout has no transfer of that
# last dataset yet, so its four originals are embedded in this file as base64
# text (the dataverse6-original-* configs) and the bootstrap decodes them; a
# copy in the checkout, SampleTransfers/Dataverse/TabularDataFormats/, takes
# precedence when it exists. Dataverse converts every tabular file to a .tab
# file and serves it as a bundle with the original file, an R data file, a DDI
# codebook and citations, which is what the Storage Service downloads. Unlike
# Dataverse 4.20, the dataset metadata of Dataverse 6 names the original file
# of every tabular file in the originalFileName field, and the bootstrap prints
# it next to each file.
#
# To add a dataset, add a manifest to the dataverse6-datasets config and run
# the bootstrap service again. It only creates the datasets whose title does
# not exist yet and rebuilds the Solr index, which is not persisted, so it can
# run at any time:
#
#   docker compose -f docker-compose.yml -f docker-compose.dataverse-6.yml up dataverse6-bootstrap
#
# The export script below reads the same manifests, so recreate the Storage
# Service container as well before exporting the new dataset:
#
#   docker compose -f docker-compose.yml -f docker-compose.dataverse-6.yml \
#     up -d --force-recreate --no-deps archivematica-storage-service
#
# Transfers from Dataverse
# ------------------------
#
# Register the instance in the Storage Service. The script creates a Dataverse
# space and a transfer source location shared with every pipeline, and prints
# the UUID of the location. It can be run again to update the settings:
#
#   docker compose -f docker-compose.yml -f docker-compose.dataverse-6.yml \
#     exec archivematica-storage-service \
#     python /etc/archivematica/dataverse6/register_transfer_source.py
#
# In the Dashboard, choose the "Dataverse" transfer type and browse the
# "Dataverse 6 (development)" location: the datasets are listed as directories
# named after their Dataverse entity id, which is also printed by the bootstrap
# service next to the dataset title. Select a dataset and start the transfer.
# The Storage Service downloads the files and the dataset metadata, and
# Archivematica runs the Dataverse microservices of the transfer workflow. The
# same transfer can be started with the API:
#
#   location="<location UUID printed by the registration script>"
#   dataset="<entity id printed by the bootstrap service>"
#   curl -X POST http://127.0.0.1:62080/api/v2beta/package \
#     -H "Authorization: ApiKey test:test" \
#     -H "Content-Type: application/json" \
#     -d "{\"name\": \"drinks\", \"type\": \"dataverse\", \"processing_config\": \"automated\", \"path\": \"$(printf '%s:%s' "${location}" "${dataset}" | base64 -w0)\"}"
#
# The datasets can be exported as transfers, exactly as a transfer receives
# them, to compare them with the transfers in SampleTransfers/Dataverse/ that
# came from Dataverse 4.20. The export script downloads every dataset through
# the Dataverse space of the Storage Service into
# /var/archivematica/storage_service/dataverse6-sample-transfers of the
# Storage Service container and prints the directory names. The following
# commands copy them to a directory of your choice:
#
#   compose="docker compose -f docker-compose.yml -f docker-compose.dataverse-6.yml"
#   target="/tmp/dataverse6-sample-transfers"
#   mkdir -p "${target}"
#   for name in $(${compose} exec -T archivematica-storage-service \
#       python /etc/archivematica/dataverse6/export_sample_transfers.py); do
#     rm -rf "${target:?}/${name:?}"
#     ${compose} cp "archivematica-storage-service:/var/archivematica/storage_service/dataverse6-sample-transfers/${name}" "${target}/${name}"
#     echo "Exported ${target}/${name}"
#   done
#
# Starting over
# -------------
#
# The Dataverse database and files live in Docker volumes. To reinstall from
# scratch, remove the Dataverse services and their volumes and start the
# overlay again:
#
#   docker compose -f docker-compose.yml -f docker-compose.dataverse-6.yml \
#     rm --stop --force dataverse6 dataverse6-bootstrap dataverse6-postgres dataverse6-solr dataverse6-rserve
#   docker volume rm am_dataverse6_data am_dataverse6_postgres_data

# The API token of the dataverseAdmin account is fixed so that the Storage
# Service registration script and the documentation above can refer to it.
x-dataverse6-api-token: &dataverse6-api-token "7c0b8e2d-3f4a-4b5c-9d6e-1f2a3b4c5d6e"

# Like the single sign-on overlays, the same URL works from the host browser
# and from the containers: the dataverse6 service listens on this port and
# gets the hostname as a network alias.
x-dataverse6-url: &dataverse6-url "http://dataverse6.localhost:62087"

services:
  archivematica-storage-service:
    environment:
      # Read by the registration and export scripts below. The Storage
      # Service itself ignores them.
      ARCHIVEMATICA_DATAVERSE6_URL: *dataverse6-url
      ARCHIVEMATICA_DATAVERSE6_API_TOKEN: *dataverse6-api-token
    configs:
      - source: dataverse6-register-transfer-source
        target: /etc/archivematica/dataverse6/register_transfer_source.py
      - source: dataverse6-export-sample-transfers
        target: /etc/archivematica/dataverse6/export_sample_transfers.py
      - source: dataverse6-datasets
        target: /etc/archivematica/dataverse6/datasets.json

  dataverse6:
    image: "gdcc/dataverse:6.11-noble"
    environment:
      # Settings of Dataverse are read from the environment (MicroProfile
      # Config): DATAVERSE_A_B is dataverse.a.b.
      DATAVERSE_DB_HOST: "dataverse6-postgres"
      DATAVERSE_DB_USER: "dataverse"
      DATAVERSE_DB_PASSWORD: "dataverse"
      DATAVERSE_DB_NAME: "dataverse"
      DATAVERSE_SOLR_HOST: "dataverse6-solr"
      DATAVERSE_RSERVE_HOST: "dataverse6-rserve"
      DATAVERSE_FQDN: "dataverse6.localhost"
      DATAVERSE_SITEURL: *dataverse6-url
      DATAVERSE_MAIL_SYSTEM_EMAIL: "dataverse@example.com"
      # There is no mail server; notifications fail quietly.
      DATAVERSE_MAIL_MTA_HOST: "localhost"
      # Read by the init script below.
      PAYARA_HTTP_PORT: "62087"
      # Datasets get DOIs under the 10.5072 test authority without
      # registering them anywhere, like the development setup of Dataverse.
      JVM_ARGS: >-
        -Ddataverse.pid.providers=fake
        -Ddataverse.pid.default-provider=fake
        -Ddataverse.pid.fake.type=FAKE
        -Ddataverse.pid.fake.label=FakeDOIProvider
        -Ddataverse.pid.fake.authority=10.5072
        -Ddataverse.pid.fake.shoulder=FK2/
    configs:
      - source: dataverse6-http-port
        target: /opt/payara/scripts/init.d/init_http_port.sh
    volumes:
      - "dataverse6_data:/dv"
    # The image declares volumes for its dumps and secrets; keep them in
    # memory, like the development setup of Dataverse does, so that they
    # do not pile up as anonymous volumes.
    tmpfs:
      - "/dumps:mode=770,size=1024M,uid=1000,gid=1000"
      - "/secrets:mode=770,uid=1000,gid=1000"
      - "/tmp:mode=770,size=2052M,uid=1000,gid=1000"
    # The image sizes the Java heap as a percentage of the memory limit.
    mem_limit: "2560m"
    ports:
      - "127.0.0.1:62087:62087"
    networks:
      default:
        aliases:
          # This makes the Dataverse URL resolvable from the Storage Service
          # and bootstrap containers. The same hostname is also used by the
          # host browser.
          - dataverse6.localhost
    depends_on:
      dataverse6-postgres:
        condition: service_healthy
      dataverse6-solr:
        condition: service_healthy
      dataverse6-rserve:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "2"
        - http://127.0.0.1:62087/api/info/version
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s

  dataverse6-bootstrap:
    # One-shot service: installs Dataverse on the first run, creates the
    # sample datasets from the sampledata originals and reindexes. Safe to
    # run again.
    image: "gdcc/configbaker:6.11-noble"
    command: ["/etc/archivematica/dataverse6/bootstrap.sh"]
    environment:
      # The bootstrap uses the service name: the curl of this image resolves
      # every *.localhost name to the loopback address without asking DNS,
      # so the network alias does not work from here.
      DATAVERSE_URL: "http://dataverse6:62087"
      DATAVERSE_PUBLIC_URL: *dataverse6-url
      DATAVERSE_ADMIN_API_TOKEN: *dataverse6-api-token
      DATAVERSE_ADMIN_PASSWORD: "admin1"
      # Key that unblocks the /api/admin endpoints, which the bootstrap
      # blocks for everybody else like a production installation would.
      DATAVERSE_UNBLOCK_KEY: "unblock"
      DATAVERSE_ROOT_NAME: "Archivematica Dataverse 6"
      DATAVERSE_CONTACT_EMAIL: "dataverse@example.com"
      POSTGRES_SERVER: "dataverse6-postgres"
      POSTGRES_USER: "dataverse"
      POSTGRES_DATABASE: "dataverse"
      PGPASSWORD: "dataverse"
      SAMPLEDATA_DIR: "/home/archivematica/archivematica-sampledata"
    configs:
      - source: dataverse6-bootstrap-script
        target: /etc/archivematica/dataverse6/bootstrap.sh
        mode: 0555
      - source: dataverse6-datasets
        target: /etc/archivematica/dataverse6/datasets.json
      - source: dataverse6-original-drinks-spss
        target: /etc/archivematica/dataverse6/originals/TabularDataFormats/drinks-spss.sav.base64
      - source: dataverse6-original-drinks-stata14
        target: /etc/archivematica/dataverse6/originals/TabularDataFormats/drinks-stata14.dta.base64
      - source: dataverse6-original-drinks-excel
        target: /etc/archivematica/dataverse6/originals/TabularDataFormats/drinks-excel.xlsx.base64
      - source: dataverse6-original-drinks-r
        target: /etc/archivematica/dataverse6/originals/TabularDataFormats/drinks-r.RData.base64
    volumes:
      - "./submodules/archivematica-sampledata/:/home/archivematica/archivematica-sampledata/:ro"
    depends_on:
      dataverse6:
        condition: service_healthy
    restart: "no"

  dataverse6-postgres:
    image: "postgres:17"
    environment:
      POSTGRES_USER: "dataverse"
      POSTGRES_PASSWORD: "dataverse"
      POSTGRES_DB: "dataverse"
    volumes:
      - "dataverse6_postgres_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dataverse"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  dataverse6-solr:
    # Solr 9.8 with the Dataverse 6.11 configset in the collection1 core. The
    # index is not persisted: the bootstrap service reindexes on every run.
    image: "archivematica-dataverse6-solr"
    build:
      # The Dockerfile copies nothing from the build context (this directory),
      # so only the Dockerfile itself is sent to the builder.
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        FROM solr:9.8.0

        # The configset (schema and configuration of the Dataverse core) that
        # the config baker image carries for its Dataverse version.
        COPY --from=gdcc/configbaker:6.11-noble --chown=solr:solr /template /template
    command: ["solr-precreate", "collection1", "/template"]
    environment:
      # From the development setup of Dataverse.
      SOLR_OPTS: "-Dsolr.jetty.request.header.size=102400"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --max-time
        - "2"
        - "http://127.0.0.1:8983/solr/collection1/select?q=*:*&rows=0"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  dataverse6-rserve:
    # Local/test-only Rserve server, the same image as the Dataverse 4.20
    # overlay builds. Dataverse sends R code to an Rserve daemon to ingest R
    # data files (.RData) as tabular data and to generate the .RData member
    # of the tabular bundles the Storage Service downloads.
    image: "archivematica-dataverse-rserve"
    build:
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        FROM rocker/r-ver:4.4.2

        # The R packages the Dataverse installation guide requires: Rserve
        # itself plus the libraries loaded by the scripts Dataverse sends to it.
        # DescTools is only used by the Data Explorer preprocessing and is left
        # out.
        RUN install2.r --error --skipinstalled Rserve R2HTML rjson haven \
            && rm -rf /tmp/downloaded_packages

        # Rserve runs unprivileged. Its working directory holds the
        # per-connection temporary files and the tabular data Dataverse
        # transfers through the Rserve file API.
        RUN useradd --system --user-group --home-dir /tmp/Rserv --create-home \
              --shell /usr/sbin/nologin rserve

        # Based on scripts/r/rserve/Rserv.conf in the Dataverse sources. The
        # uid/gid settings are not needed because the container runs as the
        # rserve user, and the daemon stays in the foreground so the container
        # keeps running.
        COPY <<'RSERV_CONF' /etc/Rserv.conf
        workdir /tmp/Rserv
        pwdfile /etc/Rserv.pwd
        remote enable
        auth required
        plaintext disable
        fileio enable
        daemon disable
        port 6311
        maxinbuf 262144
        maxsendbuf 0
        RSERV_CONF

        # The account Dataverse logs in with: its default Rserve user and
        # password.
        COPY <<'RSERV_PWD' /etc/Rserv.pwd
        rserve rserve
        RSERV_PWD
        RUN chown rserve:rserve /etc/Rserv.conf /etc/Rserv.pwd \
            && chmod 0600 /etc/Rserv.pwd

        USER rserve
        EXPOSE 6311
        # run.Rserve() starts the server inside this R process, so it stays in
        # the foreground and the container follows its lifetime.
        CMD ["Rscript", "-e", "Rserve::run.Rserve(config.file = '/etc/Rserv.conf')"]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6311"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  dataverse6_data:
  dataverse6_postgres_data:

configs:
  # The files below are written with $$ wherever the script needs a $, see
  # the layout notes at the top.

  # Init script of the dataverse6 service.
  dataverse6-http-port:
    content: |
      # Sourced by the entrypoint of the Dataverse image before Payara starts, after
      # the image's own init scripts. Payara listens on the published port so that
      # the dataverse6.localhost network alias works from the other containers with
      # the same URL as the host. The entrypoint recreates the command file on every
      # start, so the command is added on every start too.
      echo "set configs.config.server-config.network-config.network-listeners.network-listener.http-listener-1.port=$${PAYARA_HTTP_PORT:-62087}" >> "$${PREBOOT_COMMANDS_FILE}"

  # Script of the dataverse6-bootstrap service.
  dataverse6-bootstrap-script:
    content: |
      #!/bin/bash
      # Install the development Dataverse 6 instance and create the sample datasets.
      #
      # This runs in the dataverse6-bootstrap service of docker-compose.dataverse-6.yml,
      # which uses the Dataverse config baker image so the setup scripts of the
      # installer, psql, curl, jq and python3 are available. The script can run any
      # number of times:
      #
      #   1. installs Dataverse (metadata blocks, roles, the dataverseAdmin account,
      #      the root dataverse and the settings) when the root dataverse does not
      #      exist yet;
      #   2. publishes the root dataverse;
      #   3. creates and publishes one dataset per manifest in datasets.json,
      #      uploading the files from the sampledata checkout, or the copies
      #      embedded in the compose file when the checkout lacks them, unless a
      #      dataset with the same title already exists;
      #   4. reindexes, because the Solr index is not persisted.
      set -euo pipefail

      : "$${DATAVERSE_URL:=http://dataverse6:62087}"
      : "$${DATAVERSE_PUBLIC_URL:=http://dataverse6.localhost:62087}"
      : "$${DATAVERSE_ADMIN_API_TOKEN:?set to the API token given to dataverseAdmin}"
      : "$${DATAVERSE_ADMIN_PASSWORD:=admin1}"
      : "$${DATAVERSE_UNBLOCK_KEY:=unblock}"
      : "$${DATAVERSE_ROOT_NAME:=Archivematica Dataverse 6}"
      : "$${DATAVERSE_CONTACT_EMAIL:=dataverse@example.com}"
      : "$${POSTGRES_SERVER:=dataverse6-postgres}"
      : "$${POSTGRES_USER:=dataverse}"
      : "$${POSTGRES_DATABASE:=dataverse}"
      : "$${PGPASSWORD:?set to the password of the database user}"
      : "$${SAMPLEDATA_DIR:=/home/archivematica/archivematica-sampledata}"
      : "$${BOOTSTRAP_DIR:=/scripts/bootstrap}"
      # The setup scripts of the config baker read the instance URL from here.
      export DATAVERSE_URL PGPASSWORD

      datasets_file="$$(cd "$$(dirname "$${BASH_SOURCE[0]}")" && pwd)/datasets.json"
      # Base64 copies of the original files the sampledata checkout lacks, named
      # after their manifest path plus ".base64".
      originals_dir="$$(cd "$$(dirname "$${BASH_SOURCE[0]}")" && pwd)/originals"
      samples_dir="$${SAMPLEDATA_DIR}/SampleTransfers/Dataverse"
      admin_user="dataverseAdmin"
      admin_password="$${DATAVERSE_ADMIN_PASSWORD}"
      unblock_key="$${DATAVERSE_UNBLOCK_KEY}"
      token="$${DATAVERSE_ADMIN_API_TOKEN}"
      # The manifests of datasets_file, one line of JSON each, loaded by main.
      manifests=()

      log() {
          printf '[dataverse6-bootstrap] %s\n' "$$*"
      }

      die() {
          log "ERROR: $$*" >&2
          exit 1
      }

      # Run an SQL statement and print its result.
      sql() {
          psql --host "$${POSTGRES_SERVER}" --username "$${POSTGRES_USER}" \
              --dbname "$${POSTGRES_DATABASE}" --no-align --tuples-only --quiet \
              --set ON_ERROR_STOP=1 --command "$$1"
      }

      # Call the Dataverse API as dataverseAdmin and print the JSON response. Fails
      # unless the response status is OK or one of the statuses listed in
      # API_ACCEPTED_STATUSES. Usage: api METHOD PATH [curl options].
      api() {
          local method="$$1" path="$$2" response status
          shift 2
          response="$$(curl --silent --show-error --max-time 600 --request "$${method}" \
              --header "X-Dataverse-key: $${token}" "$$@" "$${DATAVERSE_URL}$${path}")" \
              || die "$${method} $${path} failed"
          status="$$(printf '%s' "$${response}" | jq -r '.status')"
          case " OK $${API_ACCEPTED_STATUSES:-} " in
              *" $${status} "*) ;;
              *) die "$${method} $${path} failed: $${response}" ;;
          esac
          printf '%s' "$${response}"
      }

      # Change a database setting through the admin API.
      setting() {
          api PUT "/api/admin/settings/$$1?unblock-key=$${unblock_key}" --data "$$2" >/dev/null
          log "setting $$1 = $$2"
      }

      # Print the title of a manifest.
      manifest_title() {
          printf '%s' "$$1" | jq -r '.dataset.datasetVersion.metadataBlocks.citation.fields[]
              | select(.typeName == "title") | .value'
      }

      install_dataverse() {
          log "running the Dataverse setup scripts"
          cd "$${BOOTSTRAP_DIR}/base"
          jq --arg name "$${DATAVERSE_ROOT_NAME}" --arg email "$${DATAVERSE_CONTACT_EMAIL}" \
              '.name = $$name | .dataverseContacts = [{contactEmail: $$email}]' \
              data/dv-root.json > data/dv-root.json.new
          mv data/dv-root.json.new data/dv-root.json
          jq --arg email "$${DATAVERSE_CONTACT_EMAIL}" '.email = $$email' \
              data/user-admin.json > data/user-admin.json.new
          mv data/user-admin.json.new data/user-admin.json
          # The insecure mode keeps the built-in users key (burrito) so that more
          # accounts can be created through the API.
          if ! ./setup-all.sh --insecure -p="$${admin_password}" > /tmp/setup-all.log 2>&1; then
              cat /tmp/setup-all.log
              die "setup-all.sh failed"
          fi

          log "assigning the API token of $${admin_user}"
          sql "UPDATE apitoken SET tokenstring = '$${token}'
               WHERE authenticateduser_id = (
                   SELECT id FROM authenticateduser WHERE useridentifier = '$${admin_user}'
               )" >/dev/null
          api GET "/api/dataverses/:root" >/dev/null \
              || die "the installation did not create the root dataverse, see /tmp/setup-all.log"

          # Block the admin API for everybody but holders of the unblock key, like
          # a production installation. The JVM options of the same name are not
          # set, so these database settings still apply.
          setting ":BlockedApiKey" "$${unblock_key}"
          setting ":BlockedApiPolicy" "unblock-key"
          setting ":BlockedApiEndpoints" "admin,test"
      }

      publish_root() {
          local status
          status="$$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "$${DATAVERSE_URL}/api/dataverses/:root")"
          if [ "$${status}" = "200" ]; then
              log "the root dataverse is published"
              return
          fi
          api POST "/api/dataverses/:root/actions/:publish" >/dev/null
          log "published the root dataverse"
      }

      dataset_exists() {
          local count
          count="$$(sql "SELECT count(*) FROM datasetfieldvalue v
              JOIN datasetfield f ON v.datasetfield_id = f.id
              JOIN datasetfieldtype t ON f.datasetfieldtype_id = t.id
              WHERE t.name = 'title' AND v.value = \$$title\$$$$1\$$title\$$")"
          [ "$${count}" != "0" ]
      }

      # Ingest and publication run in the background and lock the dataset.
      wait_for_locks() {
          local id="$$1" tries=0
          while [ "$$(api GET "/api/datasets/$${id}/locks" | jq '.data | length')" != "0" ]; do
              tries=$$((tries + 1))
              if [ "$${tries}" -ge 300 ]; then
                  die "dataset $${id} is still locked after 10 minutes"
              fi
              sleep 2
          done
      }

      wait_for_release() {
          local id="$$1" tries=0
          while [ "$$(api GET "/api/datasets/$${id}" | jq -r '.data.latestVersion.versionState')" != "RELEASED" ]; do
              tries=$$((tries + 1))
              if [ "$${tries}" -ge 150 ]; then
                  die "dataset $${id} is still not released after 5 minutes"
              fi
              sleep 2
          done
      }

      # Upload one manifest entry to a dataset.
      upload_file() {
          local id="$$1" entry="$$2" relative_path path file json tmpdir origin=""
          tmpdir="$$(mktemp -d)"
          relative_path="$$(printf '%s' "$${entry}" | jq -r '.path')"
          path="$${samples_dir}/$${relative_path}"
          if [ ! -f "$${path}" ] && [ -f "$${originals_dir}/$${relative_path}.base64" ]; then
              # The checkout does not have the file: use the embedded copy.
              path="$${tmpdir}/$$(basename "$${relative_path}")"
              base64 --decode "$${originals_dir}/$${relative_path}.base64" > "$${path}"
              origin=" (embedded copy)"
          fi
          [ -f "$${path}" ] || die "file not found: $${path}"
          file="$${path}"
          if [ "$$(printf '%s' "$${entry}" | jq -r '.keepZipped // false')" = "true" ]; then
              # Dataverse unpacks uploaded ZIP files, but keeps a ZIP file found
              # inside another ZIP file as it is.
              file="$${tmpdir}/$$(basename "$${path}").zip"
              python3 - "$${path}" "$${file}" <<'PYTHON'
      import os
      import sys
      import zipfile

      source, destination = sys.argv[1], sys.argv[2]
      with zipfile.ZipFile(destination, "w", zipfile.ZIP_STORED) as archive:
          archive.write(source, os.path.basename(source))
      PYTHON
          fi
          json="$$(printf '%s' "$${entry}" \
              | jq -c '{description: (.description // ""), categories: (.categories // [])}')"
          api POST "/api/datasets/$${id}/add" --form "file=@$${file}" --form "jsonData=$${json}" >/dev/null
          log "uploaded $$(basename "$${path}")$${origin}"
          rm -rf "$${tmpdir}"
          # Tabular files cannot be added while the previous one is being ingested.
          wait_for_locks "$${id}"
      }

      create_dataset() {
          local manifest="$$1" title response id pid entry
          title="$$(manifest_title "$${manifest}")"
          if dataset_exists "$${title}"; then
              log "dataset exists: $${title}"
              return
          fi
          log "creating dataset: $${title}"
          response="$$(printf '%s' "$${manifest}" | jq '.dataset' \
              | api POST "/api/dataverses/:root/datasets" \
                  --header "Content-Type: application/json" --data-binary @-)"
          id="$$(printf '%s' "$${response}" | jq '.data.id')"
          pid="$$(printf '%s' "$${response}" | jq -r '.data.persistentId')"
          while IFS= read -r entry; do
              upload_file "$${id}" "$${entry}"
          done < <(printf '%s' "$${manifest}" | jq -c '.files[]')
          # Publishing a large dataset is finished by a background workflow.
          API_ACCEPTED_STATUSES="WORKFLOW_IN_PROGRESS" \
              api POST "/api/datasets/$${id}/actions/:publish?type=major" >/dev/null
          wait_for_release "$${id}"
          log "published dataset $${id} ($${pid}) with these files:"
          api GET "/api/datasets/$${id}" \
              | jq -r '.data.latestVersion.files[] | "  \(.label) (\(.dataFile.contentType)) original: \(.dataFile.originalFileName // "-")"'
      }

      summary() {
          local manifest title id
          log "Dataverse is ready. Sample datasets (entity id, title):"
          for manifest in "$${manifests[@]}"; do
              title="$$(manifest_title "$${manifest}")"
              id="$$(sql "SELECT dv.dataset_id FROM datasetfieldvalue v
                  JOIN datasetfield f ON v.datasetfield_id = f.id
                  JOIN datasetfieldtype t ON f.datasetfieldtype_id = t.id
                  JOIN datasetversion dv ON f.datasetversion_id = dv.id
                  WHERE t.name = 'title' AND v.value = \$$title\$$$${title}\$$title\$$
                  ORDER BY dv.id DESC LIMIT 1")"
              log "  $${id}  $${title}"
          done
          log "Web UI: $${DATAVERSE_PUBLIC_URL} ($${admin_user} / $${admin_password})"
          log "API token of $${admin_user}: $${token}"
      }

      main() {
          local status manifest
          jq -e 'type == "array" and length > 0' "$${datasets_file}" >/dev/null \
              || die "$${datasets_file} must be a non-empty JSON array of manifests"
          mapfile -t manifests < <(jq -c '.[]' "$${datasets_file}")
          log "waiting for $${DATAVERSE_URL}"
          until curl --silent --fail "$${DATAVERSE_URL}/api/info/version" >/dev/null; do
              sleep 5
          done
          status="$$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "$${DATAVERSE_URL}/api/dataverses/:root")"
          case "$${status}" in
              404)
                  install_dataverse
                  ;;
              200|401)
                  log "Dataverse is installed"
                  ;;
              *)
                  die "unexpected response $${status} from $${DATAVERSE_URL}/api/dataverses/:root"
                  ;;
          esac
          publish_root
          for manifest in "$${manifests[@]}"; do
              create_dataset "$${manifest}"
          done
          api GET "/api/admin/index?unblock-key=$${unblock_key}" >/dev/null
          log "reindexing in the background"
          summary
      }

      main "$$@"

