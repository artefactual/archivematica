---

services:
  archivematica-tests:
    image: "archivematica-tests:latest"
    build:
      context: "../"
      dockerfile: "hack/Dockerfile"
      args:
        TARGET: "archivematica-tests"
        UBUNTU_VERSION: ${UBUNTU_VERSION:-26.04}
        PYTHON_VERSION: ${PYTHON_VERSION:-}
    volumes:
      - "../:/src"
    links:
      - "mysql"
