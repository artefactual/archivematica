---
name: "Acceptance Test"
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
jobs:
  test:
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'AMAUAT') }}"
    name: "Test ${{ matrix.tag }} on ${{ matrix.browser }} (${{ matrix.csp_profile }})"
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
      matrix:
        tag:
          - "aip-encrypt"
          - "aip-encrypt-mirror"
          - "black-box"
          - "icc"
          - "ipc preservation"
          - "ipc access"
          - "man-norm"
          - "metadata-xml"
          - "tcc"
          - "tpc"
          - "uuids-dirs"
        browser:
          - "Firefox"
        csp_profile:
          - "nonce-report-only"
          - "nonce-enforced"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          submodules: true
      - name: "Prepare CSP report artifacts directory"
        run: |
          rm -rf hack/output/csp-reports
          mkdir -p hack/output/csp-reports/raw
      - name: "Create external volumes"
        run: |
          make -C hack/ create-volumes
      - name: "Start MySQL"
        run: |
          docker compose up -d mysql
        working-directory: ./hack
      - name: "Build images"
        run: |
          make -C hack/ build
        env:
          PYTHON_VERSION: "3.10"
      - name: "Start services with ${{ matrix.csp_profile }} CSP override"
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.csp-test.yml \
            -f ${{ matrix.csp_profile == 'nonce-enforced' && 'docker-compose.csp-nonce-enforce.yml' || 'docker-compose.csp-nonce-report-only.yml' }} \
            up -d
        env:
          ELASTICSEARCH_DISK_THRESHOLD_ENABLED: "false"
        working-directory: ./hack
      - name: "Bootstrap services"
        run: |
          make -C hack/ bootstrap
      - name: "Restart services"
        run: |
          make -C hack/ restart-am-services
      - name: "Prune Docker"
        run: |
          docker builder prune --all --force
          docker image prune --all --force
        working-directory: ./hack
      - name: "Run AMAUAT tag with ${{ matrix.csp_profile }} CSP override"
        id: "amauat-run"
        run: |
          TAGS='${{ matrix.tag }}'
          TAG_ARGS=()

          for tag in $TAGS; do
            TAG_ARGS+=(--tags="$tag")
          done

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.csp-test.yml \
            -f ${{ matrix.csp_profile == 'nonce-enforced' && 'docker-compose.csp-nonce-enforce.yml' || 'docker-compose.csp-nonce-report-only.yml' }} \
            -f docker-compose.acceptance-tests.yml \
            build \
            --build-arg USER_ID="$(id -u)" \
            --build-arg GROUP_ID="$(id -g)" \
            archivematica-acceptance-tests

          docker compose \
            -f docker-compose.yml \
            -f docker-compose.csp-test.yml \
            -f ${{ matrix.csp_profile == 'nonce-enforced' && 'docker-compose.csp-nonce-enforce.yml' || 'docker-compose.csp-nonce-report-only.yml' }} \
            -f docker-compose.acceptance-tests.yml \
            run --rm -e HEADLESS=1 --no-deps archivematica-acceptance-tests behave \
              --no-capture --no-capture-stderr --no-logcapture \
              "${TAG_ARGS[@]}" --no-skipped -v --stop \
              -D driver_name=${{ matrix.browser }} \
              -D ssh_accessible=no \
              -D am_url=http://nginx/ \
              -D am_username=test \
              -D am_password=test \
              -D am_api_key=test \
              -D am_version=1.8 \
              -D ss_url=http://nginx:8000/ \
              -D ss_username=test \
              -D ss_password=test \
              -D ss_api_key=test \
              -D transfer_source_path=archivematica/archivematica-sampledata/TestTransfers/acceptance-tests \
              -D home=archivematica
        working-directory: ./hack
      - name: "Summarize CSP reports"
        if: "${{ always() }}"
        run: |
          python3 hack/helpers/summarize_csp_reports.py \
            --input-dir hack/output/csp-reports \
            --markdown-out hack/output/csp-reports/SUMMARY.md \
            --json-out hack/output/csp-reports/summary.json
      - name: "Upload CSP reports"
        if: "${{ always() }}"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f" # v7.0.0
        with:
          name: "csp-reports__${{ matrix.csp_profile }}__${{ matrix.tag }}__${{ matrix.browser }}"
          path: "./hack/output/csp-reports"
      - name: "Save docker logs on failure"
        if: "${{ (failure() && steps.amauat-run.outcome == 'failure') || (cancelled() && steps.amauat-run.outcome == 'cancelled') }}"
        run: |
          mkdir docker-logs
          docker compose logs --no-log-prefix --no-color archivematica-mcp-server > docker-logs/mcp-server.log
          docker compose logs --no-log-prefix --no-color archivematica-mcp-client > docker-logs/mcp-client.log
          docker compose logs --no-log-prefix --no-color archivematica-dashboard > docker-logs/dashboard.log
          docker compose logs --no-log-prefix --no-color archivematica-storage-service > docker-logs/storage-service.log
        working-directory: ./hack
      - name: "Upload docker logs on failure"
        if: "${{ (failure() && steps.amauat-run.outcome == 'failure') || (cancelled() && steps.amauat-run.outcome == 'cancelled') }}"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f" # v7.0.0
        with:
          name: "docker-logs__${{ matrix.csp_profile }}__${{ matrix.tag }}__${{ matrix.browser }}"
          path: "./hack/docker-logs"

  trusted-types-smoke:
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'AMAUAT') }}"
    name: "Trusted Types smoke on Chromium (nonce-report-only)"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          submodules: true
      - name: "Set up Node JS"
        uses: "actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f" # v6.3.0
        with:
          node-version: "24"
      - name: "Prepare CSP report artifacts directory"
        run: |
          rm -rf hack/output/csp-reports
          mkdir -p hack/output/csp-reports/raw
      - name: "Create external volumes"
        run: |
          make -C hack/ create-volumes
      - name: "Start MySQL"
        run: |
          docker compose up -d mysql
        working-directory: ./hack
      - name: "Build images"
        run: |
          make -C hack/ build
        env:
          PYTHON_VERSION: "3.10"
      - name: "Start services with nonce-report-only CSP override"
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.csp-test.yml \
            -f docker-compose.csp-nonce-report-only.yml \
            up -d
        env:
          ELASTICSEARCH_DISK_THRESHOLD_ENABLED: "false"
        working-directory: ./hack
      - name: "Bootstrap services"
        run: |
          make -C hack/ bootstrap
      - name: "Restart services"
        run: |
          make -C hack/ restart-am-services
      - name: "Install Chromium for Trusted Types smoke"
        run: |
          rm -rf /tmp/playwright-smoke
          npm install --prefix /tmp/playwright-smoke playwright
          /tmp/playwright-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: "Run Storage Service Trusted Types smoke"
        id: "trusted-types-smoke"
        run: |
          NODE_PATH=/tmp/playwright-smoke/node_modules \
            node hack/helpers/storage_service_trusted_types_smoke.cjs
      - name: "Summarize CSP reports"
        if: "${{ always() }}"
        run: |
          python3 hack/helpers/summarize_csp_reports.py \
            --input-dir hack/output/csp-reports \
            --markdown-out hack/output/csp-reports/SUMMARY.md \
            --json-out hack/output/csp-reports/summary.json
      - name: "Upload CSP reports"
        if: "${{ always() }}"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f" # v7.0.0
        with:
          name: "csp-reports__nonce-report-only__storage-service-trusted-types__Chromium"
          path: "./hack/output/csp-reports"
      - name: "Save docker logs on failure"
        if: "${{ (failure() && steps.trusted-types-smoke.outcome == 'failure') || (cancelled() && steps.trusted-types-smoke.outcome == 'cancelled') }}"
        run: |
          mkdir docker-logs
          docker compose logs --no-log-prefix --no-color archivematica-dashboard > docker-logs/dashboard.log
          docker compose logs --no-log-prefix --no-color archivematica-storage-service > docker-logs/storage-service.log
          docker compose logs --no-log-prefix --no-color nginx > docker-logs/nginx.log
        working-directory: ./hack
      - name: "Upload docker logs on failure"
        if: "${{ (failure() && steps.trusted-types-smoke.outcome == 'failure') || (cancelled() && steps.trusted-types-smoke.outcome == 'cancelled') }}"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f" # v7.0.0
        with:
          name: "docker-logs__nonce-report-only__storage-service-trusted-types__Chromium"
          path: "./hack/docker-logs"

  dashboard-trusted-types-smoke:
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'AMAUAT') }}"
    name: "Dashboard Trusted Types smoke on Chromium (nonce-report-only)"
    runs-on: "ubuntu-24.04"
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
        with:
          submodules: true
      - name: "Set up Node JS"
        uses: "actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f" # v6.3.0
        with:
          node-version: "24"
      - name: "Prepare CSP report artifacts directory"
        run: |
          rm -rf hack/output/csp-reports
          mkdir -p hack/output/csp-reports/raw
      - name: "Create external volumes"
        run: |
          make -C hack/ create-volumes
      - name: "Start MySQL"
        run: |
          docker compose up -d mysql
        working-directory: ./hack
      - name: "Build images"
        run: |
          make -C hack/ build
        env:
          PYTHON_VERSION: "3.10"
      - name: "Start services with nonce-report-only CSP override"
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.csp-test.yml \
            -f docker-compose.csp-nonce-report-only.yml \
            up -d
        env:
          ELASTICSEARCH_DISK_THRESHOLD_ENABLED: "false"
        working-directory: ./hack
      - name: "Bootstrap services"
        run: |
          make -C hack/ bootstrap
      - name: "Restart services"
        run: |
          make -C hack/ restart-am-services
      - name: "Install Chromium for Dashboard Trusted Types smoke"
        run: |
          rm -rf /tmp/playwright-smoke
          npm install --prefix /tmp/playwright-smoke playwright
          /tmp/playwright-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: "Run Dashboard Trusted Types smoke"
        id: "dashboard-trusted-types-smoke"
        run: |
          NODE_PATH=/tmp/playwright-smoke/node_modules \
            node hack/helpers/dashboard_trusted_types_smoke.cjs
      - name: "Summarize CSP reports"
        if: "${{ always() }}"
        run: |
          python3 hack/helpers/summarize_csp_reports.py \
            --input-dir hack/output/csp-reports \
            --markdown-out hack/output/csp-reports/SUMMARY.md \
            --json-out hack/output/csp-reports/summary.json
      - name: "Upload CSP reports"
        if: "${{ always() }}"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f" # v7.0.0
        with:
          name: "csp-reports__nonce-report-only__dashboard-trusted-types__Chromium"
          path: "./hack/output/csp-reports"
      - name: "Save docker logs on failure"
        if: "${{ (failure() && steps.dashboard-trusted-types-smoke.outcome == 'failure') || (cancelled() && steps.dashboard-trusted-types-smoke.outcome == 'cancelled') }}"
        run: |
          mkdir docker-logs
          docker compose logs --no-log-prefix --no-color archivematica-dashboard > docker-logs/dashboard.log
          docker compose logs --no-log-prefix --no-color archivematica-storage-service > docker-logs/storage-service.log
          docker compose logs --no-log-prefix --no-color nginx > docker-logs/nginx.log
        working-directory: ./hack
      - name: "Upload docker logs on failure"
        if: "${{ (failure() && steps.dashboard-trusted-types-smoke.outcome == 'failure') || (cancelled() && steps.dashboard-trusted-types-smoke.outcome == 'cancelled') }}"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f" # v7.0.0
        with:
          name: "docker-logs__nonce-report-only__dashboard-trusted-types__Chromium"
          path: "./hack/docker-logs"

  csp-report-summary:
    if: "${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'AMAUAT')) }}"
    name: "Consolidate CSP reports"
    runs-on: "ubuntu-24.04"
    needs:
      - test
      - trusted-types-smoke
      - dashboard-trusted-types-smoke
    steps:
      - name: "Check out repository"
        uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
      - name: "Download per-tag CSP report artifacts"
        uses: "actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3" # v8.0.0
        with:
          pattern: "csp-reports__*"
          path: "/tmp/csp-report-artifacts"
      - name: "Prepare consolidated CSP report artifacts directory"
        run: |
          rm -rf hack/output/csp-reports-consolidated
          mkdir -p hack/output/csp-reports-consolidated
      - name: "Combine per-tag CSP report artifacts"
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          source_root = Path("/tmp/csp-report-artifacts")
          destination_root = Path("hack/output/csp-reports-consolidated")
          combined_count = {
              "nonce-report-only": 0,
              "nonce-enforced": 0,
          }

          for mode in combined_count:
              (destination_root / mode / "raw").mkdir(parents=True, exist_ok=True)

          for report_file in sorted(source_root.glob("csp-reports__*/raw/*.json")):
              artifact_name = report_file.parent.parent.name
              _, mode, _tag, _browser = artifact_name.split("__", 3)
              mode_destination_root = destination_root / mode / "raw"
              destination = mode_destination_root / f"{artifact_name}--{report_file.name}"
              shutil.copy2(report_file, destination)
              combined_count[mode] = combined_count.get(mode, 0) + 1

          for mode, count in sorted(combined_count.items()):
              print(f"Combined {count} raw CSP report files for {mode}.")
          PY
      - name: "Summarize consolidated CSP reports"
        run: |
          for mode_dir in hack/output/csp-reports-consolidated/*; do
            if [ ! -d "$mode_dir/raw" ]; then
              continue
            fi
            python3 hack/helpers/summarize_csp_reports.py \
              --input-dir "$mode_dir" \
              --markdown-out "$mode_dir/SUMMARY.md" \
              --json-out "$mode_dir/summary.json"
          done

          python3 - <<'PY'
          from pathlib import Path

          root = Path("hack/output/csp-reports-consolidated")
          mode_titles = {
              "nonce-report-only": "Nonce Report-Only CSP",
              "nonce-enforced": "Nonce Enforced CSP",
          }
          lines = []

          for mode in ("nonce-report-only", "nonce-enforced"):
              summary_path = root / mode / "SUMMARY.md"
              if not summary_path.exists():
                  continue
              lines.append(f"## {mode_titles.get(mode, mode)}")
              lines.append("")
              lines.append(summary_path.read_text().rstrip())
              lines.append("")

          (root / "SUMMARY.md").write_text("\n".join(lines).rstrip() + "\n")
          PY
      - name: "Upload consolidated CSP reports"
        id: "upload-consolidated-csp-reports"
        uses: "actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f" # v7.0.0
        with:
          name: "csp-report-summary-consolidated"
          path: "./hack/output/csp-reports-consolidated"
      - name: "Publish consolidated CSP report summary"
        run: |
          {
            echo "## Consolidated CSP Report Artifact"
            echo
            echo "- Artifact name: \`csp-report-summary-consolidated\`"
            if [ -n "${{ steps.upload-consolidated-csp-reports.outputs.artifact-url }}" ]; then
              echo "- Download: [csp-report-summary-consolidated](${{ steps.upload-consolidated-csp-reports.outputs.artifact-url }})"
            else
              echo "- Download: available in the workflow artifacts list."
            fi
            echo
            cat hack/output/csp-reports-consolidated/SUMMARY.md
          } >> "$GITHUB_STEP_SUMMARY"
